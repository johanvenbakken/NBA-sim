<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA-sim</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/nba-logo-black-free-png-e1702364122395.jpg">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
    
        .ledertavle_bakgrunn {
            background-image: url("{{ url_for('static', filename='images/mjtrophy-edited_16x9.png') }}");
            background-size: cover;
            background-position: center;
            height: 100vh; /* Background only covers the first 100vh */
            width: 100%;
            position: relative;
        }
    
        body {
            background-color: #fff; /* Ensure the rest of the page has a white background */
        }
    </style>
</head>
{% extends "base.html" %}

{% block content %}
<body>
    <div class="ledertavle_bakgrunn">
        <div class="ledertavle_header">
            <h id="draft_headerskrift">Ledertavle</h>
        </div>
        <div class="ledertavle_innhold">
            <div class="ledertavle_boks1"></div>
            <div class="ledertavle_boks2">
                <ul>
                    {% for row in rows %}
                    <li class="draft_spilleretekst">{{ row["brukernavn"] }} - {{row["antall_seire"] }} wins</li>
                    {% endfor %}
                </ul>
            </div>
            <div class="ledertavle_boks3"></div>
        </div>
    </div>
</body>
{% endblock %}
</html>
