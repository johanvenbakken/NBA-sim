<!-- base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Flask App{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<style>
    footer {
        height: 30vh;
        width: 100%;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        text-align: center; 
        background-color: #d3d3d3;
    }

    footer p {
        margin: 10px 0;
    }

    .fa {
    padding: 15px;
    font-size: 25px;
    width: 25px;
    text-align: center;
    text-decoration: none;
    border-radius: 50%;
    margin: 5px;
    color: #ccc; /* Default grey color */
    background: #f5f5f5; /* Light grey background */
    transition: all 0.3s ease; /* Smooth transition */
    }

    /* Hover effects - each platform gets its brand color */
    .fa-facebook:hover {
        background: #3B5998;
        color: white;
    }
    
    .fa-twitter:hover {
        background: #55ACEE;
        color: white;
    }
    
    .fa-instagram:hover {
        background: #E1306C;
        color: white;
    }
    
    .fa-linkedin:hover {
        background: #0077B5;
        color: white;
    }
    
    /* Optional: Add subtle shadow on hover */
    .fa:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
</style>
<body>

    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer>
        <p style="color: #5f5f5f;">&copy; NBA Simulator. Laget av <a href="https://github.com/johanvenbakken" style="color: #5f5f5f;">Johan Venbakken</a></p>
        <br>
        <p><a href="/about" style="color: #7f7f7f;">About</a> <a href="/privacy-policy" style="color: #7f7f7f;">Privacy Policy</a> <a href="/FAQ" style="color: #7f7f7f;">FAQ</a>    <a href="mailto:johanhven@gmail.com" style="color: #7f7f7f;">Contact</a></p>
        <br>
        <div class="social-icons">
            <a href="https://www.instagram.com/johan_venbakken" class="fa fa-instagram"></a>
            <a href="https://x.com/sjokkisskurken" class="fa fa-twitter"></a>
            <a href="https://www.linkedin.com/in/johan-venbakken-68703234a/" class="fa fa-linkedin"></a>
        </div>
    </footer>

</body>
</html>
