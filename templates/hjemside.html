<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA-sim</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/nba-logo-black-free-png-e1702364122395.jpg">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
    }

    .hjemside_bakgrunn {
        background-image: url("{{ url_for('static', filename='images/jordan-knicks.png') }}");
        background-size: cover;
        background-position: center;
        height: 100vh; /* Only cover the first 100vh (viewport height) */
        width: 100%;
        position: relative;
    }

    body {
        background-color: #fff; /* This will make the rest of the body have a white background */
    }
</style>

{% extends "base.html" %}

{% block content %}
<body class="{% if not cookies_accepted %}no-interaction{% endif %}">

    <div class="hjemside_bakgrunn">
        <div class="info_container">
            <div class="tekst_boks_hjemside">
                <h1 style="font-size: 2em;" id="info_tekst_hjemside">
                    Hvordan spille: 
                    <br>
                    1. Velg to lagnavn og gå videre
                    <br>
                    2. Draft spillere utifra budsjettet
                    <br>
                    3. Simuler kampen å se hvem som vinner  
                </h1>
                <br>
                <label for="navn_lagA" class="cool_label">lagnavn lag1</label>
                <input type="text" id="navn_lagA" class="cool_input">

                <button onclick="til_login()" class="button_login_hjemside" id="login_knapp_spiller1">logg inn spiller 1</button>
                <p id="welcomeMessage1" style="display: none;" class="info_tekst_hjemside"></p>
                <button id="logout_knapp_spiller1" style="display: none;" onclick="logoutplayer1()"">Logout</button>      
                <label for="navn_lagB" class="cool_label">lagnavn lag2</label>
                <input type="text" id="navn_lagB" class="cool_input">
                
                <button onclick="til_login()" class="button_login_hjemside" id="login_knapp_spiller2">logg inn spiller 2</button>
                <p id="welcomeMessage2" style="display: none;" class="info_tekst_hjemside"></p>
                <button id="logout_knapp_spiller2" style="display: none;" onclick="logoutplayer2()">Logout</button>

            </div> 
            <div class="bilde_hjemside">
                <img id="logo_bilde" src="{{ url_for('static', filename='images/NBA-logo2.png') }}">
            </div>
        </div>
        <div class="button_container">
            <button class="button_hjemside" onclick="test()">Get balling</button>
        </div>
        {% if not cookies_accepted %}
            <div id="cookie-overlay">
                <div class="cookie-container">
                    <p>We use cookies to improve your experience. <a href="privacy-policy">Learn more</a></p>
                    <button id="accept-cookies">Accept</button>
                </div>
            </div>
        {% endif %}
        </div>
    <script>
        function test(){
        
                let navn_lagA = document.getElementById("navn_lagA").value
                let navn_lagB = document.getElementById("navn_lagB").value
        
                console.log("sucess")
                fetch('/submit_team_name', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ navn_lagA, navn_lagB })
                })
                .then(response => response.json())
                .then(data => {
                    console.log("Success:", data);
                    window.location.href = "/draft";
                })
                .catch(error => console.error("Error:", error));
            }
            
        function til_login(){
            window.location.href = "/login";
        }
        
        //hvis spillere er logget inn, byttes ut knapper med tekst. 
        function checkLoginStatus() {
            // Helper function to get cookie by name
            function getCookie(name) {
                let cookies = document.cookie.split('; ');
                for (let cookie of cookies) {
                    let [key, value] = cookie.split('=');
                    if (key === name) {
                        return decodeURIComponent(value);
                    }
                }
                return null;
            }
        
            // Check for Player 1's login status
            let player1 = getCookie("username1");
            if (player1) {
                document.getElementById("login_knapp_spiller1").style.display = "none"; // Hide button
                document.getElementById("welcomeMessage1").style.display = "block"; // Show text
                document.getElementById("logout_knapp_spiller1").style.display = "block";
                document.getElementById("welcomeMessage1").innerText = `Welcome, ${player1} (Player 1)`;
            } else {
                document.getElementById("login_knapp_spiller1").style.display = "block";
                document.getElementById("welcomeMessage1").style.display = "none";
                document.getElementById("logout_knapp_spiller1").style.display = "none";
            }
        
            // Check for Player 2's login status
            let player2 = getCookie("username2");
            if (player2) {
                document.getElementById("login_knapp_spiller2").style.display = "none";
                document.getElementById("welcomeMessage2").style.display = "block";
                document.getElementById("logout_knapp_spiller2").style.display = "block";
                document.getElementById("welcomeMessage2").innerText = `Welcome, ${player2} (Player 2)`;
            } else {
                document.getElementById("login_knapp_spiller2").style.display = "block";
                document.getElementById("welcomeMessage2").style.display = "none";
                document.getElementById("logout_knapp_spiller2").style.display = "none";
            }
            }
        
        // Run function when page loads
        document.addEventListener("DOMContentLoaded", checkLoginStatus);
        
            function til_login(player) {
                window.location.href = "/login";
            }
        
                
            checkLoginStatus();
        
        document.addEventListener("DOMContentLoaded", function () {
                const cookieOverlay = document.getElementById("cookie-overlay");
                const acceptButton = document.getElementById("accept-cookies");
                if (acceptButton) {
                    acceptButton.addEventListener("click", function () {
                        fetch("/accept-cookies")
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error("Failed to set cookie");
                                }
                                return response.text();
                            })
                            .then(() => {
                            cookieOverlay.style.display = "none";
                            document.body.classList.remove("no-interaction");
                        })
                        .catch(err => console.error("Error:", err));
                    });
                }
            });
        function logoutplayer1() { 
            window.location.href = "/logout_player1";e
        }

        function logoutplayer2() {
            window.location.href = "/logout_player2"; 
        }
    </script>
</body>
{% endblock %}
</html>
